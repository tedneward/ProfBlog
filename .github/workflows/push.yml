# Simple workflow for deploying static content to GitHub Pages
name: Bake and push static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and upload the site in one job...
  build:
    runs-on: ubuntu-latest
    steps:
      # Get the build
      - name: Checkout
        uses: actions/checkout@v4
      # Set up GH Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Pin a JDK supported by Gradle 8.12 (JVM 8-23); the runner default (Java 25)
      # causes "Unsupported class file major version 69" during build script compilation.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Set up Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      # Kick it off
      - name: Build with Gradle
        run: ./gradlew bake
      # Upload content
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './build/jbake'

  # ...then deploy in a separate job. Deploying in the same job races the
  # artifact service: the freshly finalized artifact can be invisible to
  # deploy-pages for several seconds (actions/deploy-pages#451).
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # If the first lookup missed the artifact, give the metadata time to
      # propagate and try once more before failing the job.
      - name: Wait for artifact metadata
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
